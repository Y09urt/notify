plugins {
    id 'com.android.application'
}

apply plugin: 'com.hihonor.mcs.asplugin'

Properties localProps = new Properties()
File localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
String honorPushAppId = localProps.getProperty('HONOR_PUSH_APPID', 'replace-with-your-honor-app-id')

android {
    namespace 'com.ljq.notify'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ljq.notify'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        manifestPlaceholders = [
            HONOR_PUSH_APPID: honorPushAppId
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.hihonor.mcs:push:7.0.61.303'
}
