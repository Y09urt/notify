name = "notify-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Non-sensitive defaults are deployed automatically when Cloudflare builds from GitHub.
HONOR_APP_ID = "104567925"
HONOR_TOKEN_URL = "https://iam.developer.hihonor.com/auth/token"
APP_DEBUG_LATEST_VERSION_CODE = "1"
APP_DEBUG_LATEST_VERSION_NAME = "1.0-debug"
APP_DEBUG_DOWNLOAD_URL = ""
APP_DEBUG_RELEASE_NOTES = "Debug build"
APP_RELEASE_LATEST_VERSION_CODE = "1"
APP_RELEASE_LATEST_VERSION_NAME = "1.0"
APP_RELEASE_DOWNLOAD_URL = ""
APP_RELEASE_NOTES = "Stable build"

[[d1_databases]]
binding = "DB"
database_name = "notify-db"
database_id = "02fd6e8f-2fc7-4a23-82da-31fd492fc48e"

[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "notify-push"

[[queues.consumers]]
queue = "notify-push"
max_batch_size = 10
max_batch_timeout = 5
